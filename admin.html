<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Resume Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: rgba(255,255,255,0.88);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0,0,0,0.08);
      --accent: #0071e3;
      --danger: #c62828;
      --shadow: 0 20px 60px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #fbfbfd 0%, var(--bg) 100%);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 34px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.05em;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }
    .note {
      font-size: 0.92rem;
      background: rgba(0,113,227,0.06);
      border: 1px solid rgba(0,113,227,0.12);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0 0 8px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      font: inherit;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0,113,227,0.12);
    }
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    button, .download-link {
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button {
      background: var(--accent);
      color: white;
    }
    .download-link {
      background: #111827;
      color: white;
    }
    .hidden {
      display: none;
    }
    .message {
      margin-top: 14px;
      min-height: 22px;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .error { color: var(--danger); }
    .success { color: #0f7b0f; }
    code {
      background: rgba(0,0,0,0.05);
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 0.92em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Resume Access</h1>
    <p>Use this page to unlock and download a resume file from your repo.</p>

    <div class="note">
      Before publishing, edit two values in this file: <code>ADMIN_PASSWORD</code> and <code>RESUME_FILE_PATH</code>.
    </div>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter admin password" />

    <div class="btn-row">
      <button id="unlockBtn">Unlock Resume</button>
      <a id="downloadBtn" class="download-link hidden" href="#" download>Download Resume</a>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
    const ADMIN_PASSWORD = "CHOOSE-YOUR-PASSWORD-HERE";
    const RESUME_FILE_PATH = "./resume.pdf";

    const passwordInput = document.getElementById('password');
    const unlockBtn = document.getElementById('unlockBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const message = document.getElementById('message');

    unlockBtn.addEventListener('click', function () {
      const entered = passwordInput.value;

      if (!entered) {
        message.textContent = 'Enter a password first.';
        message.className = 'message error';
        return;
      }

      if (entered === ADMIN_PASSWORD) {
        downloadBtn.href = RESUME_FILE_PATH;
        downloadBtn.classList.remove('hidden');
        message.textContent = 'Access granted. Your resume download is ready.';
        message.className = 'message success';
      } else {
        downloadBtn.classList.add('hidden');
        message.textContent = 'Incorrect password.';
        message.className = 'message error';
      }
    });

    passwordInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        unlockBtn.click();
      }
    });
  </script>
</body>
</html>
